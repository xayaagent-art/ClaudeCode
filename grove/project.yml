# XcodeGen specification for the Grove iOS app.
# Generate the Xcode project with:  xcodegen generate --spec grove/project.yml --project grove
# The .xcodeproj is generated output and stays out of source control.
name: Grove

options:
  bundleIdPrefix: app.grove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  GroveKit:
    path: GroveKit

targets:
  Grove:
    type: application
    platform: iOS
    sources:
      - GroveApp
    dependencies:
      - package: GroveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grove.ios
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GroveApp/Info.plist
      properties:
        CFBundleDisplayName: Grove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  GroveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GroveUITests
    dependencies:
      - target: Grove

schemes:
  Grove:
    build:
      targets:
        Grove: all
        GroveUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GroveUITests
